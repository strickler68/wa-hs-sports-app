# postgrest.conf — run with: postgrest postgrest.conf
# Docs: https://postgrest.org/en/stable/references/configuration.html

# Connection string — same database schema.sql and seed_data.sql were loaded into.
db-uri = "postgres://authenticator:change_me_before_deploying@localhost:5432/wahsports"

# Which Postgres schema to expose as the API. schema.sql doesn't set one
# explicitly, so this is Postgres's default.
db-schemas = "public"

# The role PostgREST falls back to when a request carries no auth token.
# Matches web_anon from db_roles_and_grants.sql — read-only.
db-anon-role = "web_anon"

# Port the API listens on. With this running, http://localhost:3000/schools
# returns every row in the schools table as JSON — no code written for that,
# PostgREST generates it directly from the table.
server-port = 3000

# Required once you add real auth (a JWT-issuing login flow, e.g. via
# Supabase or your own auth service). Until then, every request is treated
# as web_anon (read-only) unless you're testing with the "Authenticate as
# web_editor for local testing" trick in postgrest_examples.md.
# jwt-secret = "replace-with-a-real-secret-at-least-32-bytes-long"
